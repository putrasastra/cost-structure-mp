<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marketplace Cost Structure Calculator</title>
    <meta name="description" content="Kalkulator struktur biaya marketplace (Shopee, TikTok)" />
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: light; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji','Segoe UI Emoji'; margin:0; background:#f8fafc; color:#0f172a }
      .container { max-width: 1100px; margin: 0 auto; padding: 24px }
      .card { background:#fff; border:1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04) }
      .row { display:flex; gap:16px }
      .col { flex:1 }
      input, select { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px }
      label { font-size:12px; color:#475569; font-weight:600 }
      .muted { color:#64748b }
      .btn { padding:10px 14px; border:1px solid #cbd5e1; border-radius:8px; background:#fff; font-weight:600; cursor:pointer }
      .btn.primary { background:#2563eb; color:#fff; border-color:#2563eb }
      .header { display:flex; align-items:center; justify-content:space-between }
      .tabs { background:#f1f5f9; padding:4px; border-radius:8px; display:inline-flex }
      .tab { padding:8px 14px; font-weight:600; border-radius:8px; border:1px solid transparent; cursor:pointer }
      .tab.active { background:#fff; color:#0f172a; border-color:#e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,.06) }
      table { width:100%; border-collapse:collapse; font-size:13px }
      th, td { border-bottom:1px solid #e2e8f0; padding:8px 10px; text-align:left }
      th { background:#f8fafc; color:#475569; text-transform:uppercase; font-size:11px }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.jsx"></script>
  </body>
  </html>
